<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickTask</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/b214036e26.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="ticktask-container">
      <header>
        <div class="logo"><img src="assets/logo.png" alt="logo" /></div>
        <button class="createBtn" id="openInput">
          <i class="fa-solid fa-plus"></i>
        </button>
      </header>
      <section class="progress">
        <div class="title"><h2>Your Progress</h2></div>
        <div class="progress-track">
          <div class="pending">Pending: (<span id="pendingTask">0</span>)</div>
          <div class="completed">
            Completed: (<span id="completedTask">0</span>)
          </div>
        </div>
      </section>
      <section class="filter">
        <button class="filterBtn activeFilter" data-filter="all">All</button>
        <button class="filterBtn" data-filter="pending">Pending</button>
        <button class="filterBtn" data-filter="completed">Completed</button>
      </section>

      <section class="task-wrapper"></section>
    </div>

    <div class="modal-wrapper" id="inputModal">
      <div class="ticktask-input" id="ticktaskInput">
        <div class="input-header">
          <h3>Create New Task</h3>
          <button class="closeBtn"><i class="fa-solid fa-x"></i></button>
        </div>
        <div class="input-main">
          <form class="input-form">
            <label for="title">Task Title</label>
            <input type="text" required name="title" />
            <label for="description">Task Description</label>
            <textarea
              name="description"
              rows="4"
              cols="30"
              id="descriptionInput"
            ></textarea>
            <div class="input-footer">
              <button class="saveBtn inputFooterBtn" type="submit">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="modal-wrapper" id="editModal">
      <div class="ticktask-input" id="ticktaskEdit">
        <div class="edit-header">
          <h3>Edit Task</h3>
          <button class="closeBtnEd"><i class="fa-solid fa-x"></i></button>
        </div>
        <div class="input-main">
          <form class="edit-form">
            <label for="title">Task Title</label>
            <input type="text" required name="title" />
            <label for="description">Task Description</label>
            <textarea
              name="description"
              rows="4"
              cols="30"
              id="descriptionEdit"
            ></textarea>
            <div class="input-footer">
              <button class="saveBtnEd inputFooterBtn" type="submit">
                Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
