<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickTask</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/b214036e26.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="ticktask-container">
      <header>
        <div class="logo"><img src="assets/logo.png" alt="logo" /></div>
        <button id="mode" onclick="toggleMode()">
          <i class="fa-solid fa-moon"></i>
        </button>
      </header>
      <section class="progress">
        <div class="title"><h2>Your Progress</h2></div>
        <div class="progress-track">
          <div class="pending">Pending: (<span>10</span>)</div>
          <div class="completed">Completed: (<span>3</span>)</div>
        </div>
      </section>
      <section class="filter">
        <button>All</button>
        <button>Pending</button>
        <button>Completed</button>
      </section>
      <section class="create">
        <button><i class="fa-solid fa-square-plus"></i></button>
      </section>
      <section class="create-task">
        <div class="task">
          <input type="checkbox"  id="checkbox">
          <div class="taskheadering">
            <h3>Task 1</h3>
            <p class="description">Lorem ipsum dolor sit.</p>
          </div>
          <div class="edit">
            <i class="fa-solid fa-pen-to-square pen"></i>
            <i class="fa-solid fa-trash dlt"></i>
          </div>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
